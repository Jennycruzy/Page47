name: Page 47 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest -q

      - name: Check formatting and imports
        run: ruff check src/page47 scripts tests

      - name: Check strict types
        run: MYPYPATH=src mypy --strict --explicit-package-bases src/page47

      - name: Check resident-facing language
        run: python scripts/check_plain_language.py
