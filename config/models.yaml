schema_version: 1
region: eu-west-2

# These IDs were selected only after ListFoundationModels and GetFoundationModel
# returned them in eu-west-2 on 2026-09-05. Keep this file as the single runtime
# configuration source; application code must not contain model IDs.
triage:
  model_id: amazon.nova-micro-v1:0
document:
  model_id: amazon.nova-lite-v1:0
agents:
  archivist: amazon.nova-micro-v1:0
  substance: amazon.nova-lite-v1:0
  # Downstream nodes receive predecessor results. Live checks on 2026-09-05
  # showed Nova Lite handles that input reliably with Converse tool calls.
  process: amazon.nova-lite-v1:0
  skeptic: amazon.nova-lite-v1:0
  brief_writer: amazon.nova-lite-v1:0

inference:
  temperature: 0.0
  # Nova tool calls are run without streaming after a live tool-use check on
  # 2026-09-05; this avoids invalid ConverseStream tool sequences.
  streaming: false
  triage_max_output_tokens: 256
  document_max_output_tokens: 1200
  agent_max_output_tokens: 1000
  max_document_pages: 12
  max_page_characters: 12000
  render_scale: 1.5

verification:
  captured_at: "2026-09-05T14:16:43.339086Z"
  list_foundation_models: available
  metadata:
    amazon.nova-micro-v1:0:
      input_modalities: [TEXT]
      output_modalities: [TEXT]
      response_streaming_supported: true
    amazon.nova-lite-v1:0:
      input_modalities: [TEXT, IMAGE, VIDEO]
      output_modalities: [TEXT]
      response_streaming_supported: true
  invocation_status: available
