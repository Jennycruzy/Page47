triage:
  minimum_references: 1
  context_characters: 180
  terms:
    - height
    - feet
    - ft
    - dollars
    - contract
    - parcel
    - parcels
    - zone
    - zoning
    - permit
    - date
    - ordinance
  references:
    - name: height_or_distance
      expression: '\b\d{1,4}(?:\.\d+)?\s*(?:feet|foot|ft\.?)(?:\b|\s)'
    - name: dollar_amount
      expression: '\$\s?\d{1,3}(?:,\d{3})*(?:\.\d{2})?\b'
    - name: parcel_number
      expression: '\b(?:parcel|tax account|lot)\s*(?:number|no\.?|#)?\s*[A-Z0-9-]{4,}\b'
    - name: calendar_date
      expression: '\b(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2},\s+\d{4}\b'
