# Temporary HTTP-only virtual host used to obtain the first certificate.
# Enable this file only after page47.xcover.online resolves to the Lightsail IP.
server {
    listen 80;
    listen [::]:80;
    server_name page47.xcover.online;

    root /var/www/certbot;
    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
