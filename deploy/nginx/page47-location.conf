# Include this inside the existing TLS server block. The Page 47 console now
# lives at its dedicated subdomain; keep old bookmarks working by redirecting
# them there before the xCover application catch-all handles the request.
location = /page47 {
    return 301 https://page47.xcover.online/;
}

location /page47/ {
    rewrite ^/page47/?(.*)$ https://page47.xcover.online/$1 permanent;
}
