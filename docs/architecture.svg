  <text class="node-copy" x="810" y="465" text-anchor="middle">capture time · status · errors</text>
  <text class="node-copy" x="810" y="485" text-anchor="middle">ETag · manifest chain · optional S3</text>
  <rect class="node" x="1014" y="403" width="190" height="100" rx="12"/>
  <text class="node-title" x="1109" y="432" text-anchor="middle">Normalizer</text>
  <text class="node-copy" x="1109" y="457" text-anchor="middle">common matter history</text>
  <text class="node-copy" x="1109" y="478" text-anchor="middle">version lineage</text>
  <rect class="node-green" x="1256" y="403" width="160" height="100" rx="12"/>
  <text class="node-title" x="1336" y="432" text-anchor="middle">Comparator</text>
  <text class="node-copy" x="1336" y="457" text-anchor="middle">clearer · less clear</text>
  <text class="node-copy" x="1336" y="478" text-anchor="middle">mixed · abstain</text>
