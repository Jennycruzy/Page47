  <rect class="boundary" x="48" y="366" width="1404" height="178" rx="18"/>
  <rect class="node" x="78" y="403" width="225" height="100" rx="12"/>
  <text class="node-title" x="190" y="432" text-anchor="middle">15-minute scheduler</text>
  <text class="node-copy" x="190" y="457" text-anchor="middle">completed-run heartbeat</text>
  <text class="node-copy" x="190" y="478" text-anchor="middle">failed runs stay visible</text>
