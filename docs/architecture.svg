<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960" role="img" aria-labelledby="title desc">
  <title id="title">Page 47 architecture</title>
  <desc id="desc">Resident watch setup flows through city adapters, append-only evidence capture, deterministic comparison, a five-role Strands investigation graph, evidence policy, and an evidence-linked alert.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52665b"/>
    </marker>
    <marker id="dashed-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7186a8"/>
    </marker>
    <style>
      .bg { fill: #f7f8f3; }
      .title { fill: #14231b; font: 800 32px Inter, ui-sans-serif, system-ui, sans-serif; }
      .subtitle { fill: #52665b; font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; }
      .section { fill: #22664b; font: 800 13px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 2px; }
      .node { fill: #ffffff; stroke: #b9cbbd; stroke-width: 2; }
      .node-green { fill: #e8f2e9; stroke: #82ae91; stroke-width: 2; }
      .node-blue { fill: #edf3fb; stroke: #9db4d4; stroke-width: 2; }
