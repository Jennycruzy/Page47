      .node-copy { fill: #52665b; font: 400 13px Inter, ui-sans-serif, system-ui, sans-serif; }
      .small { fill: #52665b; font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; }
      .arrow { fill: none; stroke: #52665b; stroke-width: 2.5; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #7186a8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#dashed-arrow); }
      .boundary { fill: none; stroke: #d4dfd5; stroke-width: 2; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="bg" width="1500" height="960" rx="24"/>
  <text class="title" x="64" y="68">Page 47 · evidence before interpretation</text>
  <text class="subtitle" x="64" y="98">A resident watch becomes a retained observation, a skeptical review, and an evidence-linked question.</text>

