  <text class="node-copy" x="828" y="716" text-anchor="middle">accept · reject</text>
  <text class="node-copy" x="828" y="737" text-anchor="middle">or insufficient</text>
  <rect class="node" x="966" y="662" width="190" height="110" rx="12"/>
  <text class="node-title" x="1061" y="691" text-anchor="middle">Brief Writer</text>
  <text class="node-copy" x="1061" y="716" text-anchor="middle">accepted evidence</text>
  <text class="node-copy" x="1061" y="737" text-anchor="middle">≤ 3 questions</text>
