  <text class="node-copy" x="185" y="248" text-anchor="middle">city · area · email</text>
  <rect class="node-green" x="362" y="196" width="235" height="72" rx="12"/>
  <text class="node-title" x="479" y="225" text-anchor="middle">Watch setup</text>
  <text class="node-copy" x="479" y="248" text-anchor="middle">private management link</text>
  <rect class="node-green" x="666" y="196" width="235" height="72" rx="12"/>
  <text class="node-title" x="783" y="225" text-anchor="middle">Page 47 web</text>
  <text class="node-copy" x="783" y="248" text-anchor="middle">findings · replay · stop</text>
