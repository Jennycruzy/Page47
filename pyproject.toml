[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "page47"
version = "0.1.0"
description = "A civic record tool that examines how public matters are presented over time."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Page 47 contributors" }]
dependencies = [
    "boto3>=1.43.88",
    "bedrock-agentcore>=1.22.0",
    "aws-opentelemetry-distro>=0.18.0",
    "strands-agents>=1.0.0",
    # Keep the managed runtime reproducible: these transitive versions were
    # present in the last known-good AgentCore artifact.
    "mcp==1.29.1",
    "pydantic>=2.4.0",
    "pypdfium2>=4.30.0",
    "Pillow>=10.0.0",
    "fonttools>=4.0.0",
    "PyYAML>=6.0.2",
    "pypdf==6.17.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "boto3-stubs[bedrock,bedrock-agentcore-control]>=1.43.88",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/page47"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/page47"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/page47/web/app.py" = ["E501"]
"src/page47/web/frontend.py" = ["E501"]
